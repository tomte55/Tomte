# Push a tag like v1.2.0 to build Tomte-v1.2.0.zip and publish it as a GitHub release.
# The tag must match "## Version:" in Tomte.toc, and CHANGELOG.md must have a "## v1.2.0" section
# (its text becomes the release notes).
# A beta tag like v1.2.0-beta.1 is checked against "## Version: 1.2.0", takes its notes from CHANGELOG.md's
# "## Unreleased" section, and is published as a GitHub pre-release (the "latest" link stays on the last release) and a
# CurseForge beta (only people who opted into betas get it).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Tomte

      - name: Unit tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
          for t in Tomte/tests/test_*.lua; do lua5.1 "$t"; done

      - name: Check version and changelog
        working-directory: Tomte
        run: |
          tag="${GITHUB_REF_NAME}"
          base="${tag%%-*}"
          toc="v$(sed -n 's/^## Version: *//p' Tomte.toc | tr -d '\r')"
          if [ "$base" != "$toc" ]; then echo "Tag $tag doesn't match Tomte.toc ($toc)"; exit 1; fi
          if [ "$base" != "$tag" ]; then section="## Unreleased"; echo "BETA=1" >> "$GITHUB_ENV"; else section="## $tag"; fi
          awk -v v="$section" '$0 ~ "^## " { if (found) exit; if (index($0, v) == 1) { found = 1; next } } found' CHANGELOG.md > ../notes.md
          if [ ! -s ../notes.md ]; then echo "CHANGELOG.md has no '$section' section"; exit 1; fi

      - name: Build zip
        working-directory: Tomte
        run: git archive --format=zip --prefix=Tomte/ -o "../Tomte-${GITHUB_REF_NAME}.zip" HEAD

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Tomte-${GITHUB_REF_NAME}.zip" --repo "$GITHUB_REPOSITORY" --title "Tomte $GITHUB_REF_NAME" --notes-file notes.md ${BETA:+--prerelease}

      # Uploads the same zip and notes to CurseForge. Skipped until the repo has a CF_API_TOKEN secret (CurseForge >
      # account > API tokens) and Tomte.toc has "## X-Curse-Project-ID: <id>". The game version comes from the TOC's
      # "## Interface:" (120105 -> 12.1.5) and must exist on CurseForge, or the upload stops with a message.
      # Forever's version comes from Tomte_Forever.toc the same way and is only added when CurseForge lists it.
      - name: Upload to CurseForge
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          project="$(sed -n 's/^## X-Curse-Project-ID: *//p' Tomte/Tomte.toc | tr -d '\r')"
          if [ -z "$CF_API_TOKEN" ] || [ -z "$project" ]; then echo "No CF_API_TOKEN or X-Curse-Project-ID: skipped"; exit 0; fi
          iface="$(sed -n 's/^## Interface: *//p' Tomte/Tomte.toc | tr -d '\r' | cut -d, -f1)"
          gv="$((iface / 10000)).$((iface / 100 % 100)).$((iface % 100))"
          versions="$(curl -sf -H "X-Api-Token: $CF_API_TOKEN" https://wow.curseforge.com/api/game/versions)"
          id="$(printf '%s' "$versions" | jq --arg v "$gv" 'map(select(.name == $v)) | .[0].id // empty')"
          if [ -z "$id" ]; then echo "CurseForge has no game version $gv yet"; exit 1; fi
          fiface="$(sed -n 's/^## Interface: *//p' Tomte/Tomte_Forever.toc | tr -d '\r' | cut -d, -f1)"
          fgv="$((fiface / 10000)).$((fiface / 100 % 100)).$((fiface % 100))"
          fid="$(printf '%s' "$versions" | jq --arg v "$fgv" 'map(select(.name == $v)) | .[0].id // empty')"
          if [ -z "$fid" ]; then echo "CurseForge has no game version $fgv: retail only"; fi
          kind="release"
          if [ -n "$BETA" ]; then kind="beta"; fi
          jq -n --rawfile notes notes.md --arg name "Tomte $GITHUB_REF_NAME" --argjson gv "[$id${fid:+,$fid}]" --arg kind "$kind" \
            '{changelog: $notes, changelogType: "markdown", displayName: $name, gameVersions: $gv, releaseType: $kind}' > cf.json
          curl -sf -H "X-Api-Token: $CF_API_TOKEN" -F "metadata=<cf.json" -F "file=@Tomte-${GITHUB_REF_NAME}.zip" \
            "https://wow.curseforge.com/api/projects/$project/upload-file"
